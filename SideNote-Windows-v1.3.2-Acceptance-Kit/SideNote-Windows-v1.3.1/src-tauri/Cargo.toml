[package]
name = "sidenote-windows"
version = "3.2.0"
description = "SideNote desktop sticky notes"
authors = ["SideNote"]
edition = "2021"

[lib]
name = "sidenote_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

chacha20poly1305 = "0.10"
hex = "0.4"

# Ed25519 device authentication.
ed25519-dalek = "2"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
mdns-sd = "0.13"
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Registry"] }
